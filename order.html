  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
    <header class="navbar">
    <div class="logo">

    <nav>

    <a href="order.html" class="order-button">
      Oder Now
    </a>
  </header>

  <section class="contact" id="contact">
    <div class="contact-wrapper">
      <div class="contact-text">

        <p class="section-label">
          PLACE AN ORDER
        </p>

        <h2>
          Your next cup
          <span>
            is waiting.
          </span>
        </h2>

        <p>
          Fill out the form and we'll receive your order request directly.
        </p>

        <div class="contact-info">
          <p>
            📍 Riau Street No. 12
          </p>
          <p>
            🕐 Mon - Sun: 08:00 - 22:00
          </p>
          <p>
            📞 +62 123 4567 8901
          </p>

          <div class="share">
            <a class="x" href="https://x.com/Buantayy">
              <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a class="ig" href="https://www.instagram.com/jsen.h01/">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a class="wa" href="">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
          </div>

      </div>
    </div>

      <form id="orderForm">
        <div class="form-group">
          <label>
            Your Name
          </label>

          <input 
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
            >
        </div>

      <div class="form-group">
        <label>
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          required
          >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>
            Coffee
          </label>

          <select 
            id="coffee"
            name="coffee"
            required
            >

            <option value="">
              Select coffee
            </option>

            <option value="Caffe Latte">
              Caffe Latee
            </option>

            <option value="Cappuccino">
              Cappuccino
            </option>

            <option value="Americano">
              Americano
            </option>

            <option value="Chocolate Mocha">
              Chocolate Mocha
            </option>     
            </select>
        </div>

        <div class="form-group">
          <label>
            Quantity
          </label>

          <input 
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            max="20"
            value="1"
            required
            >
        </div>
      </div>

      <div class="form-group">
        <label>
          Message
        </label>

        <textarea 
          id="message"
          name="message"
          rows="5"
          placeholder="Any special requests?">
        </textarea>
      </div>

      <button 
        type="submit"
        id="submitButton"
        >
        Send order ☕
        </button>

      <p id="status"></p>
        </form>
    </div>
  </section>

  <footer>
    <div class="footer-logo">
      Lohan<span>&</span>Bean
    </div>

    <p>© 2026 Lohan & Bean.</p>

    <div class="socials">
      <span>
        Instagram
      </span>

      <span>
        Faceboook
      </span>
    </div>
  </footer>

    <script src = "script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

  </body>
  </html>
